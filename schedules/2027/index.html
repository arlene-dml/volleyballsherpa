<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare 2027 Club Tournament Schedules | Volleyball Sherpa</title>
</head>
<body>
  <p id="status">Loading the 2027 schedules…</p>
  <script>
    fetch('https://raw.githubusercontent.com/arlene-dml/volleyballsherpa/e199d24c3535ff4d6568f529e2e627f68a985eb0/schedules/2027/index.html')
      .then(response => {
        if (!response.ok) throw new Error('Could not load the schedule.');
        return response.text();
      })
      .then(html => {
        html = html.replace(/^\s*volleyball-sherpa-schedule-CODE\.txt\s+100%\s*/, '');
        html = html.replace(/\s*Displaying volleyball-sherpa-schedule-CODE\.txt\.\s*$/, '');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.getElementById('status').textContent = 'The schedule could not be loaded. Please try again shortly.';
      });
  </script>
</body>
</html>
